name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Lógica (vitest)
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Navegador (Playwright)
        run: npm run test:e2e
      - name: Contra los emuladores de Firebase
        run: npm run test:firebase
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultados
          path: test-results/
